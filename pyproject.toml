[project]
name = "flet-gallery"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "hachirog", email = "hachiro@grape80.com" }
]
dependencies = [
    "flet>=0.86.5"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.grape80"
product = "flet-gallery"
company = "Grape"
copyright = "© 2026 Grape"

[tool.flet.app]
path = "src"
